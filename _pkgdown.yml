url: https://johngavin.github.io/irishbuoys/

footer:
  structure:
    left: [developed_by]
    right: [built_with]

template:
  bootstrap: 5
  bslib:
    preset: "shiny"
  includes:
    in_header: |
      <style>
      /* Fix content hidden behind fixed navbar */
      .page-header { padding-top: 1rem; }
      main { padding-top: 1rem; }
      .template-home main > .row:first-child { padding-top: 0.5rem; }
      </style>
    after_body: |
      <script>
      // Add dynamic timestamp to footer
      document.addEventListener('DOMContentLoaded', function() {
        var footer = document.querySelector('footer');
        if (footer) {
          var timestamp = document.createElement('p');
          timestamp.className = 'text-muted';
          timestamp.innerHTML = 'Site generated: ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
          footer.appendChild(timestamp);
        }
      });
      </script>

navbar:
  structure:
    left: [intro, articles, reference]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/JohnGavin/irishbuoys
      aria-label: GitHub

