name: Data Update (daily)

# Incremental pipeline using actions/cache for _targets/ store
#
# How it works:
#   1. Checkout main (source code)
#   2. Restore _targets/ from actions/cache (incremental state)
#   3. Run data update + tar_make() (only rebuilds changed targets)
#   4. Render vignettes (tar_load works — _targets/ is present)
#   5. Commit rendered outputs (inst/extdata/*.rds, docs/) to main
#   6. actions/cache auto-saves _targets/ at job end (next run restores it)
#
# Schedule:
#   - Runs daily at 06:00 UTC
#   - ERDDAP data is hourly with ~10h lag (data_mode=M / delayed mode)
#   - Daily runs keep the dashboard within ~30h of real-time
#   - Also triggered by storm-alert.yml when storms are detected
#   - Can always be triggered manually via workflow_dispatch
#
# See: https://github.com/JohnGavin/irishbuoys/issues/56

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Main Pipeline Job ────────────────────────────────────
  # Runs on: 6-hourly schedule, storm-alert dispatch, or manual trigger.
  # No gate job needed — cron runs are routine, other triggers are intentional.
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # runs routinely take 79-89 min; 90 was too tight (#89)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── Checkout & Environment ──────────────────────────────

      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          log-directives: nix_installer=trace
          backtrace: full

      - name: Setup magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (rstats-on-nix + johngavin)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      - name: Build development environment
        run: nix-build default.nix -A shell --no-out-link

      # ── Restore Pipeline State ──────────────────────────────
      # actions/cache restores _targets/ from the most-recent prior run
      # (restore-keys: targets- matches any earlier cache key).
      # On cache miss the store is absent; tar_make() does a full build.
      # actions/cache auto-saves _targets/ at job end when a new key is used.

      - name: Cache targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ github.run_id }}
          restore-keys: |
            targets-

      # ── Data Update & Pipeline ──────────────────────────────
      # Pre-pipeline fetch: DuckDB is ephemeral in CI (gitignored, not cached).
      # Without this step, tar_make() may use cached stale email_summary_data
      # (from _targets/ cache), sending emails with weeks-old data.
      # This fetch ensures the DB has fresh data BEFORE the pipeline runs.

      - name: Bootstrap DuckDB from Parquet (skip full ERDDAP fetch)
        run: |
          PARQUET="docs/vignettes/data/buoy_data.parquet"
          DB="inst/extdata/irish_buoys.duckdb"

          if [ ! -f "$DB" ] && [ -f "$PARQUET" ]; then
            echo "DuckDB missing — bootstrapping from committed Parquet..."
            nix-shell default.nix -A shell --run "Rscript -e '
              pkgload::load_all(quiet = TRUE)
              con <- connect_duckdb(db_path = \"$DB\", create_new = TRUE)
              on.exit(DBI::dbDisconnect(con))

              pq <- arrow::read_parquet(\"$PARQUET\")
              cat(\"Parquet rows:\", nrow(pq), \"\\n\")

              # Insert via staging table (same as load_to_duckdb but skip column renaming
              # since Parquet already has standardized names from prior export)
              DBI::dbWriteTable(con, \"staging_bootstrap\", pq, temporary = TRUE)

              cols <- intersect(DBI::dbListFields(con, \"staging_bootstrap\"),
                                DBI::dbListFields(con, \"buoy_data\"))
              cols_sql <- paste(cols, collapse = \", \")
              n <- DBI::dbExecute(con, paste0(
                \"INSERT INTO buoy_data (\", cols_sql, \") \",
                \"SELECT \", cols_sql, \" FROM staging_bootstrap \",
                \"ON CONFLICT DO NOTHING\"
              ))
              DBI::dbExecute(con, \"DROP TABLE IF EXISTS staging_bootstrap\")

              final_n <- DBI::dbGetQuery(con, \"SELECT COUNT(*) AS n FROM buoy_data\")\$n
              cat(\"Bootstrapped DuckDB with\", final_n, \"rows from Parquet\\n\")
            '"
          elif [ -f "$DB" ]; then
            echo "DuckDB exists — skipping bootstrap"
          else
            echo "::warning::No Parquet file at $PARQUET — will do full ERDDAP fetch"
          fi

      - name: Fetch fresh data (incremental update)
        env:
          # With Parquet bootstrap, only need recent data (168h = 1 week).
          # Falls back to full fetch (65000h) only if DB is still empty.
          LOOKBACK_HOURS: '168'
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            pkgload::load_all(quiet = TRUE)

            db_path <- \"inst/extdata/irish_buoys.duckdb\"
            con <- connect_duckdb(db_path = db_path)
            n_existing <- DBI::dbGetQuery(con, \"SELECT COUNT(*) AS n FROM buoy_data\")\$n
            DBI::dbDisconnect(con)

            # If DB is empty (no Parquet bootstrap), fall back to full fetch
            lookback <- if (n_existing == 0) {
              cat(\"DB empty — using full 65000h lookback\\n\")
              65000L
            } else {
              cat(\"DB has\", n_existing, \"rows — using 168h incremental fetch\\n\")
              as.integer(Sys.getenv(\"LOOKBACK_HOURS\", unset = \"168\"))
            }

            result <- incremental_update(
              db_path = db_path,
              lookback_hours = lookback
            )
            cat(\"Status:\", result\$status, \"\\n\")
            cat(\"Records added:\", result\$records_added, \"\\n\")
            if (!is.null(result\$summary)) {
              cat(\"Latest data:\\n\")
              print(result\$summary[, c(\"station_id\", \"latest\")])
            }
            if (result\$status == \"error\") {
              stop(\"Data fetch failed: \", result\$error)
            }
          '"

      - name: Validate targets plan
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            targets::tar_config_set(store = \"_targets\")
            targets::tar_validate()
            cat(\"tar_validate() PASSED\\n\")
          '"

      - name: Run pipeline (data update + analysis)
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOOKBACK_HOURS: '168'
        run: |
          echo "::notice::Update trigger: ${{ github.event_name }}"
          nix-shell default.nix -A shell --run "Rscript -e '
            targets::tar_config_set(store = \"_targets\")
            # Exclude slow/dev-only targets from data pipeline:
            # - vignette_*: rendered separately below
            # - qa_*: covr takes 50+ min; QA runs in R-CMD-check
            # - pkgctx_*: builds Rust tool from source (~20 min); dev-only
            # - pkgdown_*: pkgdown::build_site() calls quarto render on all
            #   vignettes internally, which fails in CI. Vignettes are rendered
            #   explicitly in the next step instead.
            targets::tar_make(
              names = !tidyselect::starts_with(\"vignette_\") &
                      !tidyselect::starts_with(\"qa_\") &
                      !tidyselect::starts_with(\"pkgctx_\") &
                      !tidyselect::starts_with(\"pkgdown_\")
            )
          '"

      # ── Verify Data Freshness ─────────────────────────────────
      # Fail-fast: abort before committing or deploying if data is stale.
      # With 6-hourly runs, data older than 24h indicates a problem
      # (ERDDAP outage, fetch failure, or pipeline cache issue).

      - name: Verify email data freshness
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            pkgload::load_all(quiet = TRUE)
            summary <- targets::tar_read(email_summary_data)
            stats <- summary\$ingestion_stats
            if (is.null(stats) || nrow(stats) == 0) {
              stop(\"No ingestion stats in email_summary_data\")
            }
            # Filter to reporting stations only (offline stations have latest=NA)
            reporting <- stats[!is.na(stats\$latest), ]
            if (nrow(reporting) == 0) {
              stop(\"All stations offline — no recent data at all\")
            }
            n_offline <- nrow(stats) - nrow(reporting)
            if (n_offline > 0) {
              offline_ids <- stats\$station_id[is.na(stats\$latest)]
              cat(\"Offline stations:\", paste(offline_ids, collapse = \", \"), \"\\n\")
            }
            max_age <- max(as.numeric(difftime(Sys.time(), reporting\$latest, units = \"hours\")))
            cat(\"Max data age (reporting stations):\", round(max_age, 1), \"hours\\n\")
            cat(\"Stations reporting:\", nrow(reporting), \"/\", nrow(stats), \"\\n\")
            # ERDDAP delayed mode has ~10h lag; with 6-hourly runs max expected ~16h.
            # Warn at 36h, but do NOT abort — allow pipeline to recover from outages.
            if (max_age > 36) {
              warning(\"STALE EMAIL DATA: \", round(max_age), \"h old (threshold: 36h). Continuing to allow recovery.\")
            }
            if (max_age > 18) {
              warning(\"Email data is \", round(max_age), \"h old (> 18h, possible ERDDAP delay)\")
            }
            cat(\"Email freshness check PASSED\\n\")
          '"

      - name: Verify dashboard data freshness
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            pkgload::load_all(quiet = TRUE)
            sc <- targets::tar_read(dash_vignette_scalars)
            if (is.null(sc\$data_end_time)) {
              stop(\"No data_end_time in dash_vignette_scalars\")
            }
            age_h <- as.numeric(difftime(Sys.time(), sc\$data_end_time, units = \"hours\"))
            cat(\"Dashboard data age:\", round(age_h, 1), \"hours\\n\")
            if (age_h > 24) {
              warning(\"Dashboard data is \", round(age_h), \"h old (threshold: 24h)\")
            }
            cat(\"Dashboard freshness check PASSED\\n\")
          '"

      # ── Render Vignettes ────────────────────────────────────
      # _targets/ is present (restored + updated), so tar_load() works

      - name: Render vignettes (explicit re-render after data update)
        run: |
          # All vignettes rendered explicitly (vignette targets excluded from tar_make)
          for qmd in dashboard_static wave_analysis telemetry api-usage; do
            echo "::group::Rendering ${qmd}"
            nix-shell default.nix -A shell --run "
              cd vignettes && quarto render ${qmd}.qmd
            " || echo "::warning::${qmd} explicit render failed (targets pipeline may have rendered it)"
            echo "::endgroup::"
          done

      - name: Copy rendered vignettes to pkgdown articles directory
        run: |
          # Quarto outputs to docs/vignettes/ (project _quarto.yml: output-dir: docs)
          # pkgdown serves articles from docs/articles/ — copy there
          mkdir -p docs/articles
          for name in wave_analysis telemetry dashboard_static api-usage; do
            if [ -f "docs/vignettes/${name}.html" ]; then
              cp "docs/vignettes/${name}.html" "docs/articles/"
              echo "Copied ${name}.html to docs/articles/"
            fi
            if [ -d "docs/vignettes/${name}_files" ]; then
              rm -rf "docs/articles/${name}_files"
              cp -r "docs/vignettes/${name}_files" "docs/articles/"
              echo "Copied ${name}_files/ to docs/articles/"
            fi
          done

      - name: Generate landing page (docs/index.html)
        run: |
          mkdir -p docs
          cat > docs/index.html <<'LANDING_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>irishbuoys — Irish Weather Buoy Network</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                     max-width: 800px; margin: 2rem auto; padding: 0 1rem;
                     color: #333; background: #fafafa; }
              h1   { color: #1a5276; border-bottom: 2px solid #1a5276; padding-bottom: 0.4rem; }
              p.lead { font-size: 1.1rem; color: #555; margin-bottom: 1.5rem; }
              ul   { list-style: none; padding: 0; }
              li   { margin: 0.8rem 0; }
              a    { color: #1a5276; font-weight: 600; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .desc { color: #666; font-size: 0.9rem; }
              footer { margin-top: 3rem; font-size: 0.8rem; color: #aaa; }
            </style>
          </head>
          <body>
            <h1>irishbuoys — Irish Weather Buoy Network</h1>
            <p class="lead">
              Real-time and historical data from Ireland's network of offshore weather buoys,
              updated daily from ERDDAP.
            </p>
            <ul>
          LANDING_EOF

          # Append links only for articles that actually exist (degrade gracefully)
          add_link() {
            local file="$1" href="$2" title="$3" desc="$4"
            if [ -f "docs/articles/${file}" ]; then
              cat >> docs/index.html <<LINK_EOF
              <li><a href="${href}">${title}</a><br><span class="desc">${desc}</span></li>
          LINK_EOF
            else
              echo "::warning::docs/articles/${file} not found — omitting from landing page"
            fi
          }

          add_link "dashboard_static.html" "articles/dashboard_static.html" \
            "Irish Buoys Explorer" \
            "Interactive dashboard: current conditions, wave heights, sea temperature, and wind across all buoys."

          add_link "wave_analysis.html" "articles/wave_analysis.html" \
            "Irish Buoys Analysis" \
            "Exploratory wave and meteorological analysis across the buoy network."

          add_link "telemetry.html" "articles/telemetry.html" \
            "Telemetry" \
            "Pipeline telemetry: data-fetch metrics, ingestion statistics, and pipeline health."

          add_link "api-usage.html" "articles/api-usage.html" \
            "Static Data API" \
            "How to access the pre-built Parquet dataset and static JSON API endpoints."

          cat >> docs/index.html <<'FOOTER_EOF'
            </ul>
            <footer>
              Built daily by <a href="https://github.com/JohnGavin/irishbuoys">irishbuoys</a>
              &mdash; data from the Irish National Buoy Network via ERDDAP.
            </footer>
          </body>
          </html>
          FOOTER_EOF
          echo "docs/index.html generated"

      # ── Upload built site for Pages deploy (#89: don't commit HTML to main) ──

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 1

      # ── Commit Rendered Outputs to main ─────────────────────

      - name: Commit rendered outputs to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inst/extdata/*.rds || true
          # #89: do NOT commit rendered HTML to main (it bloated .git to 3.1 GB).
          # Only the Parquet (needed by next run's DuckDB bootstrap) is committed;
          # the full rendered site deploys from the build artifact (deploy-pages job).
          git add docs/vignettes/data/buoy_data.parquet || true
          git diff --staged --quiet || git commit -m "Data update (${{ github.event_name }}): $(date +'%Y-%m-%dT%H:%M')Z"
          git push || true

      # ── Push Parquet to HuggingFace ─────────────────────────
      # Public dataset at hf://datasets/JohnGavin/irish-buoy-network
      # Uses git clone + git-lfs push (NOT REST API)

      - name: Push Parquet to HuggingFace
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          PARQUET="docs/vignettes/data/buoy_data.parquet"
          if [ ! -f "$PARQUET" ]; then
            echo "::warning::No Parquet file at $PARQUET — skipping HF push"
            exit 0
          fi

          ROW_COUNT=$(nix-shell default.nix -A shell --run "Rscript -e '
            cat(nrow(arrow::read_parquet(\"$PARQUET\")))
          '" 2>/dev/null || echo "unknown")

          TMPDIR=$(mktemp -d)
          git clone --depth 1 \
            "https://hf-user:${HF_TOKEN}@huggingface.co/datasets/JohnGavin/irish-buoy-network" \
            "$TMPDIR/repo" || {
            echo "::warning::HF clone failed — skipping push"
            rm -rf "$TMPDIR"
            exit 0
          }

          cp "$PARQUET" "$TMPDIR/repo/buoy_data.parquet"

          git -C "$TMPDIR/repo" add buoy_data.parquet
          git -C "$TMPDIR/repo" diff --staged --quiet || {
            git -C "$TMPDIR/repo" \
              -c user.email="action@github.com" \
              -c user.name="GitHub Action" \
              commit -m "Update buoy_data: ${ROW_COUNT} rows $(date +'%Y-%m-%dT%H:%M')Z"
            git -C "$TMPDIR/repo" push
            echo "✔ Pushed Parquet to HuggingFace (${ROW_COUNT} rows)"
          }

          rm -rf "$TMPDIR"

      # ── Artifacts ───────────────────────────────────────────

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: update_log_*.rds
          retention-days: 30
          if-no-files-found: ignore

      - name: Prepare failure artifact
        if: failure()
        run: rm -rf .git .github

      - name: Post failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure
          path: .

  # ── Deploy to GitHub Pages ──────────────────────────────
  # GITHUB_TOKEN pushes don't trigger other workflows (GitHub limitation),
  # so we deploy pages directly from this workflow instead of relying on
  # deploy-dashboard.yml to detect the docs/ push.
  deploy-pages:
    needs: update-data
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Download built site (from update-data; #89 — not committed to main)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs

      - name: Verify docs exist
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "::error::No docs/index.html in built site artifact"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
