name: Daily Storm Alert

# Checks Open-Meteo wind forecasts for all Irish buoy stations.
# Sends email alert ONLY when Beaufort 9+ (strong gale) winds are forecast.
# No email on calm days.
#
# When storms are detected, directly triggers the data update workflow
# for an immediate data refresh (instead of waiting for the next daily run).

on:
  schedule:
    - cron: '0 8 * * *'  # Daily 8am UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  storm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      STORM_ALERT_THRESHOLD_KNOTS: '41'

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          log-directives: nix_installer=trace
          backtrace: full

      - name: Setup magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (rstats-on-nix + johngavin)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      - name: Build development environment
        run: nix-build default.nix -A shell --no-out-link

      - name: Run storm alert check
        id: alert
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            devtools::load_all()
            result <- send_storm_alert()
            cat(\"Status:\", result\$status, \"\\n\")
            cat(\"Storms:\", result\$n_storms, \"\\n\")
            if (!is.null(result\$stations_affected)) {
              cat(\"Stations:\", paste(result\$stations_affected, collapse = \", \"), \"\\n\")
            }
            # Save result for artifact
            saveRDS(result, \"storm_alert_result.rds\")
            # Save preview if available
            if (!is.null(result\$preview_file) && file.exists(result\$preview_file)) {
              file.copy(result\$preview_file, \"storm_alert_preview.html\")
            }
            # Write storm status for subsequent workflow steps
            writeLines(result\$status, \"storm_status.txt\")
            writeLines(as.character(result\$n_storms), \"storm_count.txt\")
            # Exit 1 only on error (not on no_storms)
            if (result\$status == \"error\") quit(status = 1)
          '"

          # Export status for subsequent steps
          STATUS=$(cat storm_status.txt 2>/dev/null || echo "error")
          N_STORMS=$(cat storm_count.txt 2>/dev/null || echo "0")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "n_storms=$N_STORMS" >> $GITHUB_OUTPUT

          if [ "$N_STORMS" -gt "0" ] 2>/dev/null; then
            echo "storms_detected=true" >> $GITHUB_OUTPUT
          else
            echo "storms_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger data update (storms detected)
        if: steps.alert.outputs.storms_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice::Triggering data update workflow (${{ steps.alert.outputs.n_storms }} storm hours detected)"
          gh workflow run data-update.yml || echo "::warning::Failed to trigger data update"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-alert-result
          path: |
            storm_alert_result.rds
            storm_alert_preview.html
          retention-days: 7
          if-no-files-found: ignore
