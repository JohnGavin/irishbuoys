name: Deploy Dashboard to GitHub Pages

# #89: docs/ is no longer committed to main — the data-update workflow deploys
# Pages from its build artifact. Kept for manual redeploys only; the push
# trigger is disabled so this never deploys an HTML-less main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify docs exist
        run: |
          if [ ! -f "docs/index.html" ] && [ ! -f "docs/dashboard_shinylive.html" ]; then
            echo "ERROR: No dashboard found in docs/"
            echo "Build locally first: quarto render vignettes/dashboard_shinylive.qmd --output-dir ../docs"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
