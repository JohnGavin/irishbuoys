name: Weekly Data Update

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays 2 AM UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Setup Cachix (rstats-on-nix)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      # Note: nixpkgs date is pinned in default.nix (2026-01-22)
      # This ensures consistency between local dev and CI
      - name: Perform incremental data update
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            devtools::load_all()
            result <- incremental_update(db_path = \"inst/extdata/irish_buoys.duckdb\", lookback_hours = 72)
            saveRDS(result, file = paste0(\"update_log_\", Sys.Date(), \".rds\"))
            if (result\$status == \"error\") quit(status = 1)
            cat(\"Records added:\", result\$records_added, \"\\n\")
          '"

      - name: Run targets pipeline
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            targets::tar_config_set(store = \"_targets\")
            targets::tar_make()
          '" || echo "Targets pipeline completed with warnings"

      - name: Restore _targets/.gitignore after tar_make
        run: git checkout -- _targets/.gitignore

      - name: Render wave_analysis vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render wave_analysis.qmd --output-dir ../docs/articles/
          " || echo "wave_analysis render failed"

      - name: Render telemetry vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render telemetry.qmd --output-dir ../docs/articles/
          " || echo "telemetry render failed"

      - name: Render dashboard_static vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render dashboard_static.qmd --output-dir ../docs/articles/
          " || echo "dashboard_static render failed"

      - name: Commit updates
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git lfs install
          git add _targets/objects/ _targets/meta/meta _targets/.gitignore
          git add inst/extdata/*.rds
          git add docs/articles/ docs/vignettes/ || true
          git diff --staged --quiet || git commit -m "Weekly update: data + vignettes - $(date +'%Y-%m-%d')"
          git push || true

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: update_log_*.rds
          retention-days: 30
          if-no-files-found: ignore
