name: Weekly Data Update

# Incremental pipeline using targets-runs branch pattern
# (inspired by https://github.com/b-rodrigues/nix_targets_pipeline)
#
# How it works:
#   1. Checkout main (source code)
#   2. Restore _targets/ from targets-runs branch (incremental state)
#   3. Run data update + tar_make() (only rebuilds changed targets)
#   4. Render vignettes (tar_load works — _targets/ is present)
#   5. Commit rendered outputs (inst/extdata/*.rds, docs/) to main
#   6. Save _targets/ state to targets-runs branch for next run
#
# Schedule:
#   - Always runs on Sundays at 2 AM UTC (regular weekly update)
#   - Runs daily Mon-Sat ONLY when STORM_MODE repo variable is "true"
#     (set by storm-alert.yml when Beaufort 8+ winds are forecast)
#   - Reverts to weekly when storm forecast clears
#   - Can always be triggered manually via workflow_dispatch

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (gate job skips non-storm weekdays)
  workflow_dispatch:

jobs:
  # ── Gate Job: skip Mon-Sat unless storm mode is active ────
  should-run:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run_pipeline: ${{ steps.check.outputs.run_pipeline }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check if update needed
        id: check
        run: |
          DAY_OF_WEEK=$(date -u +%u)  # 1=Mon ... 7=Sun
          EVENT="${{ github.event_name }}"
          STORM_MODE="${{ vars.STORM_MODE }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run_pipeline=true" >> $GITHUB_OUTPUT
            echo "reason=manual trigger" >> $GITHUB_OUTPUT
          elif [ "$DAY_OF_WEEK" = "7" ]; then
            echo "run_pipeline=true" >> $GITHUB_OUTPUT
            echo "reason=regular Sunday update" >> $GITHUB_OUTPUT
          elif [ "$STORM_MODE" = "true" ]; then
            echo "run_pipeline=true" >> $GITHUB_OUTPUT
            echo "reason=storm mode active (daily update)" >> $GITHUB_OUTPUT
          else
            echo "run_pipeline=false" >> $GITHUB_OUTPUT
            echo "reason=skipped (not Sunday, no storm mode)" >> $GITHUB_OUTPUT
          fi

      - name: Report decision
        run: echo "::notice::Pipeline decision - run=${{ steps.check.outputs.run_pipeline }} (${{ steps.check.outputs.reason }})"

  # ── Main Pipeline Job ────────────────────────────────────
  update-data:
    needs: should-run
    if: needs.should-run.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── Checkout & Environment ──────────────────────────────

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for targets-runs branch

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          log-directives: nix_installer=trace
          backtrace: full

      - name: Setup magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Cachix (rstats-on-nix + johngavin)
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
          extraPullNames: johngavin

      - name: Build development environment
        run: nix-build default.nix -A shell --no-out-link

      # ── Restore Pipeline State ──────────────────────────────

      - name: Check if targets-runs branch exists
        id: runs-exist
        run: git ls-remote --exit-code --heads origin targets-runs
        continue-on-error: true

      - name: Checkout previous pipeline state
        if: steps.runs-exist.outcome == 'success'
        uses: actions/checkout@v6
        with:
          ref: targets-runs
          fetch-depth: 1
          path: .targets-runs

      - name: Restore _targets/ from previous run
        if: steps.runs-exist.outcome == 'success'
        run: |
          if [ -f ".targets-runs/.targets-files" ]; then
            nix-shell default.nix -A shell --run "Rscript -e '
              files <- scan(\".targets-runs/.targets-files\", what = character())
              restored <- 0L
              for (dest in files) {
                source <- file.path(\".targets-runs\", dest)
                if (!file.exists(dirname(dest))) dir.create(dirname(dest), recursive = TRUE)
                if (file.exists(source)) { file.rename(source, dest); restored <- restored + 1L }
              }
              cat(\"Restored\", restored, \"pipeline files from targets-runs\\n\")
            '"
          else
            echo "No .targets-files manifest found — running pipeline from scratch"
          fi

      # ── Data Update & Pipeline ──────────────────────────────

      - name: Perform incremental data update
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "::notice::Update reason: ${{ needs.should-run.outputs.reason }}"
          nix-shell default.nix -A shell --run "Rscript -e '
            devtools::load_all()
            result <- incremental_update(db_path = \"inst/extdata/irish_buoys.duckdb\", lookback_hours = 72)
            saveRDS(result, file = paste0(\"update_log_\", Sys.Date(), \".rds\"))
            if (result\$status == \"error\") quit(status = 1)
            cat(\"Records added:\", result\$records_added, \"\\n\")
          '"

      - name: Run targets pipeline
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          nix-shell default.nix -A shell --run "Rscript -e '
            targets::tar_config_set(store = \"_targets\")
            targets::tar_make()
          '" || echo "Targets pipeline completed with warnings"

      # ── Render Vignettes ────────────────────────────────────
      # _targets/ is present (restored + updated), so tar_load() works

      - name: Render wave_analysis vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render wave_analysis.qmd --output-dir ../docs/articles/
          " || echo "wave_analysis render failed"

      - name: Render telemetry vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render telemetry.qmd --output-dir ../docs/articles/
          " || echo "telemetry render failed"

      - name: Render dashboard_static vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render dashboard_static.qmd --output-dir ../docs/articles/
          " || echo "dashboard_static render failed"

      - name: Render api-usage vignette
        run: |
          nix-shell default.nix -A shell --run "
            cd vignettes && quarto render api-usage.qmd --output-dir ../docs/articles/
          " || echo "api-usage render failed"

      # ── Commit Rendered Outputs to main ─────────────────────

      - name: Commit rendered outputs to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inst/extdata/*.rds || true
          git add docs/api/ || true
          git add docs/articles/ docs/vignettes/ || true
          git diff --staged --quiet || git commit -m "Data update (${{ needs.should-run.outputs.reason }}): $(date +'%Y-%m-%d')"
          git push || true

      # ── Save Pipeline State to targets-runs ─────────────────

      - name: Identify pipeline output files
        run: git ls-files -mo --exclude='*.duckdb' --exclude='.targets-runs' > .targets-files

      - name: Create targets-runs branch if needed
        if: steps.runs-exist.outcome != 'success'
        run: git checkout --orphan targets-runs

      - name: Switch to targets-runs branch
        if: steps.runs-exist.outcome == 'success'
        run: |
          rm -r .git
          mv .targets-runs/.git .
          rm -rf .targets-runs

      - name: Commit pipeline state to targets-runs
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          rm -rf .gitignore .github/workflows
          git add --all -- ':!*.duckdb'
          for file in $(cat .targets-files); do
            git add --force "$file" 2>/dev/null || true
          done
          git commit -am "Pipeline state: $(date +'%Y-%m-%d')" || echo "No changes to pipeline state"
          git push origin targets-runs || echo "Failed to push targets-runs"

      # ── Artifacts ───────────────────────────────────────────

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: update_log_*.rds
          retention-days: 30
          if-no-files-found: ignore

      - name: Prepare failure artifact
        if: failure()
        run: rm -rf .git .github .targets-files .targets-runs

      - name: Post failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure
          path: .
