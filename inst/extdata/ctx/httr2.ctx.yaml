kind: function
name: req_error
exported: true
signature: req_error(req, is_error = NULL, body = NULL)
arguments:
  body: A callback function that takes a single argument (the response) and returns a character vector of additional information to include in the body of the error.
  is_error: A predicate function that takes a single argument (the response) and returns TRUE or FALSE indicating whether or not an R error should be signalled.
  req: A httr2 request object.
returns: A modified HTTP request.
---
kind: function
name: req_retry
exported: true
signature: req_retry(req,max_tries = NULL,max_seconds = NULL,retry_on_failure = FALSE,is_transient = NULL,backoff = NULL,after = NULL,failure_threshold = Inf,failure_timeout = 30,failure_realm = NULL)
arguments:
  after: A function that takes a single argument (the response) and returns either a number of seconds to wait or NA.
  backoff: A function that takes a single argument (the number of failed attempts so far) and returns the number of seconds to wait.
  failure_threshold, failure_timeout, failure_realm: Set failure_threshold to activate "circuit breaking" where if a request continues to fail after failure_threshold times, cause the request to error until a timeout of failure_timeout seconds has elapsed.
  is_transient: A predicate function that takes a single argument (the response) and returns TRUE or FALSE specifying whether or not the response represents a transient error.
  max_tries, max_seconds: Cap the maximum number of attempts (max_tries), the total elapsed time from the first request (max_seconds), or both.
  req: A httr2 request object.
  retry_on_failure: Treat low-level failures as if they are transient errors that can be retried.
returns: A modified HTTP request.
