returns: Data frame suitable for plotting
---
kind: function
name: calculate_gpd_return_levels
exported: true
signature: calculate_gpd_return_levels(gpd_fit,return_periods = c(1, 5, 10),n_obs_per_year = 8760,n_total = NULL,exceedance_rate = NULL,conf_level = 0.95)
arguments:
  conf_level: 'Confidence level for intervals (default: 0.95)'
  exceedance_rate: Pre-computed exceedance rate (lambda).
  gpd_fit: 'A list from the per-station GPD fitting targets, with elements: u (threshold), scale, shape, n_exceed, and optionally se_scale, se_shape.'
  n_obs_per_year: 'Number of observations per year for exceedance rate calculation (default: 8760 for hourly data)'
  n_total: Total number of observations.
  return_periods: 'Numeric vector of return periods in years (default: c(1, 5, 10))'
returns: 'Data frame with columns: return_period, return_level, lower, upper, threshold_value, method.'
