---
kind: context_header
llm_instructions: This is an LLM-optimized API specification for the R package 'irishbuoys'. Use this context to write correct code using irishbuoys functions. Each 'function' record describes a public function with its signature, arguments, and purpose. The 'package' record contains metadata. All listed functions are part of the public API.
---
kind: package
schema_version: '1.1'
name: irishbuoys
version: 0.2.0
language: R
description: Analyze Irish Weather Buoy Network Data
---
kind: function
name: read_predictions
exported: true
