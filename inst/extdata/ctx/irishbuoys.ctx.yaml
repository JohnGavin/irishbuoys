kind: function
name: test_rogue_propagation
exported: true
signature: test_rogue_propagation(data,rogue_threshold = 2.0,min_wave_height = 2.0,station_pairs = NULL,propagation_speed_kmh = 30,n_permutations = 500,station_info = NULL)
arguments:
  data: 'Data frame with columns: time (POSIXct), station_id (character), wave_height (numeric), hmax (numeric).'
  min_wave_height: 'Minimum significant wave height in metres for a qualifying observation (default: 2.0).'
  n_permutations: 'Number of permutations for the test (default: 500).'
  propagation_speed_kmh: 'Assumed deep-water group velocity in km/h (default: 30).'
  rogue_threshold: 'Hmax/Hs ratio threshold for rogue classification (default: 2.0).'
  station_info: Optional data frame from \link[=get_station_info]{get_station_info()}.
  station_pairs: Optional list of character vectors, each of length 2, specifying directed pairs c(source, receiver).
returns: 'List with: Data frame with columns: station1, station2, distance_km, theoretical_lag_hrs, n_rogue_s1, n_rogue_s2, co_occurrence_count, co_occurrence_rate, marginal_rate, perm_mean_rate, p_value, h3_significant (logical), h3_verdict.'
