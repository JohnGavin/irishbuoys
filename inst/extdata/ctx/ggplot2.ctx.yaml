signature: geom_smooth(mapping = NULL, data = NULL,stat = "smooth", position = "identity",...,method = NULL,formula = NULL,se = TRUE,na.rm = FALSE,orientation = NA,show.legend = NA,inherit.aes = TRUE)
arguments:
  '...': Other arguments passed on to \link[=layer]{layer()}'s params argument.
  data: The data to be displayed in this layer.
  formula: Formula to use in smoothing function, eg.
  fullrange: If TRUE, the smoothing line gets expanded to the range of the plot, potentially beyond the data.
  geom, stat: Use to override the default connection between geom_smooth() and stat_smooth().
  inherit.aes: If FALSE, overrides the default aesthetics, rather than combining with them.
  level: Level of confidence band to use (0.95 by default).
  mapping: Set of aesthetic mappings created by \link[=aes]{aes()}.
  method: Smoothing method (function) to use, accepts either NULL or a character vector, e.g.
  method.args: List of additional arguments passed on to the modelling function defined by method.
  n: Number of points at which to evaluate smoother.
  na.rm: If FALSE, the default, missing values are removed with a warning.
  orientation: The orientation of the layer.
  position: A position adjustment to use on the data for this layer.
  se: Display confidence band around smooth?
  show.legend: logical.
  span: Controls the amount of smoothing for the default loess smoother.
  xseq: A numeric vector of values at which the smoother is evaluated.
