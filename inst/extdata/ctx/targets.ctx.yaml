kind: function
name: tar_target
exported: true
signature: tar_target(name,command,pattern = NULL,tidy_eval = targets::tar_option_get("tidy_eval"),packages = targets::tar_option_get("packages"),library = targets::tar_option_get("library"),format = targets::tar_option_get("format"),repository = targets::tar_option_get("repository"),iteration = targets::tar_option_get("iteration"),error = targets::tar_option_get("error"),memory = targets::tar_option_get("memory"),garbage_collection = isTRUE(targets::tar_option_get("garbage_collection")),deployment = targets::tar_option_get("deployment"),priority = targets::tar_option_get("priority"),resources = targets::tar_option_get("resources"),storage = targets::tar_option_get("storage"),retrieval = targets::tar_option_get("retrieval"),cue = targets::tar_option_get("cue"),description = targets::tar_option_get("description"))
arguments:
  command: R code to run the target.
  cue: An optional object from tar_cue() to customize the rules that decide whether the target is up to date.
  deployment: Character of length 1.
  deps: Optional character vector of the adjacent upstream dependencies of the target, including targets and global objects.
  description: Character of length 1, a custom free-form human-readable text description of the target.
  error: Character of length 1, what to do if the target stops and throws an error.
  format: Optional storage format for the target's return value.
  garbage_collection: 'Logical: TRUE to run base::gc() just before the target runs, in whatever R process it is about to run (which could be a parallel worker).'
  iteration: Character of length 1, name of the iteration mode of the target.
  library: Character vector of library paths to try when loading packages.
  memory: Character of length 1, memory strategy.
  name: Symbol, name of the target.
  packages: Character vector of packages to load right before the target runs or the output data is reloaded for downstream targets.
  pattern: Code to define a dynamic branching branching for a target.
  priority: Deprecated on 2025-04-08 (targets version 1.10.1.9013).
  repository: Character of length 1, remote repository for target storage.
  resources: Object returned by tar_resources() with optional settings for high-performance computing functionality, alternative data storage formats, and other optional capabilities of targets.
  retrieval: Character string to control when the current target loads its dependencies into memory before running.
  storage: Character string to control when the output of the target is saved to storage.
  string: Optional string representation of the command.
  tidy_eval: Logical, whether to enable tidy evaluation when interpreting command and pattern.
returns: A target definition object.
