  debug: Print additional debug information, such as queries.
  drv: Object returned by duckdb()
  environment_scan: Set to TRUE to treat data frames from the calling environment as tables.
  read_only: Set to TRUE for read-only operation.
  shutdown: Unused.
  timezone_out: The time zone returned to R, defaults to "UTC", which is currently the only timezone supported by duckdb.
  tz_out_convert: How to convert timestamp columns to the timezone specified in timezone_out.
returns: duckdb() returns an object of class 4classduckdb_driver.
